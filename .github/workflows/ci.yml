name: CI

on:
  push:
    branches: ["main", "develop", "feat/**", "fix/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  # Job names below are part of the release contract:
  # .github/workflows/release.yml (REQUIRED_CI_JOBS) refuses to publish unless
  # every one of them is present and green for the exact commit. Renaming a job
  # here without updating that list fails the release closed, loudly.
  #
  # CI does not run the race detector. The full race wave costs more than a
  # four-core runner can absorb (a single package needs about 38 minutes alone)
  # and dominated main-push wall time, so it is now a local pre-release check
  # (`make test-race`), not a gate. Main pushes run the full non-race suite,
  # pull requests run the fast non-race suite, Recovery correctness is its own
  # parallel job, and controlled performance runs on a fresh runner after
  # Build & Test. The measured window stays quiet (the documented ordering), a
  # slow runner's throughput miss is retryable without rerunning the whole
  # suite, and the performance job gets a fresh VM.
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify Bun
        run: bun --version

      - name: Verify dependencies
        run: go mod verify

      - name: Build — all (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: Test (pull request and non-main pushes)
        # Pull-request feedback must stay under six minutes. Production-path
        # tests still execute generated TypeScript through Bun and run the real
        # CLI as a child process; this target only skips the two broad
        # executable-discovery tables that the main-push suite below covers.
        if: github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch')
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: make test-pr

      - name: Test (main)
        # The main-push run is the exact-commit authority consumed by release.
        # It is the FULL non-race suite. The race detector is deliberately not
        # part of CI: it is a local pre-release check (`make test-race`), and
        # running it here cost more than the runner could absorb.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: make test

  web:
    name: Web contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Web boundary tests
        # Hermetic: the Vitest suite exercises the schema parse, adaptTranscript
        # hand-off, and actionable transcript error copy without a network or a
        # Peasant store.
        run: cd web && pnpm test

      - name: Generated TypeScript freshness
        # Regenerates src/generated/api.ts to a temp path and diffs it, so the
        # committed OpenAPI artifact and the TypeScript consumers cannot drift.
        run: make web-verify-generated

      - name: Typecheck and build
        # The release-authority contract requires this exact build step. pnpm
        # build writes internal/webui/assets, which the Go binary embeds.
        run: cd web && pnpm build

      - name: Verify embedded web bundle freshness
        run: |
          stale=$(git status --porcelain -- internal/webui/assets)
          if [ -n "$stale" ]; then
            echo "internal/webui/assets is stale: it does not match 'cd web && pnpm build'."
            echo "Rebuild and commit the bundle before landing:"
            echo "    cd web && pnpm install --frozen-lockfile && pnpm build"
            echo "    git add internal/webui/assets"
            echo "$stale"
            exit 1
          fi

      - name: List unit tests
        run: cd web && pnpm exec vitest list --filesOnly

      - name: List browser tests
        run: cd web && pnpm exec playwright test --list

      - name: Install Chromium
        run: cd web && pnpm exec playwright install --with-deps chromium

      - name: Browser tests
        run: cd web && pnpm test:browser

  recovery:
    name: Recovery correctness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Recovery tests (non-race)
        # The main-push run is part of the exact-commit authority consumed by
        # release. It runs without the race detector, like every other CI step.
        env:
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: go test -count=1 -timeout 30m -tags=recovery ./internal/engine/...

  performance:
    name: Controlled performance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Controlled performance (required)
        # Runs on a fresh runner after Build & Test: no concurrent suite or
        # independent heavy builder is alive on this runner during the measured
        # window. Unscaled reference-host thresholds; do not add a CI factor.
        run: make test-performance

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Installer script syntax and truncation safety
        # Syntax and shape only, not behavioral proof: bash -n parses the
        # script, and the last-line check keeps a truncated transfer from
        # running a half install. Behavior is covered by the acceptance
        # recipes against a real release.
        run: |
          bash -n install.sh
          last="$(awk 'NF{last=$0} END{print last}' install.sh)"
          if [ "$last" != 'main "$@"' ]; then
            echo "::error::install.sh must call main on its last non-empty line (truncated-transfer safety)"
            exit 1
          fi

      - name: Installer staging cleanup
        # Behavioral and hermetic: a failing cp or chmod during staging must
        # leave no `.pasture-install.*` file and must install neither binary.
        run: bash tools/install-staging-test.sh

      - name: Installer config and user service
        # Behavioral and hermetic: absent-only config creation, marked-unit
        # refresh, foreign/symlink preservation, opt-out, no-systemd, XDG
        # placement, service-step failures, and the manual-daemon guard.
        run: bash tools/install-config-service-test.sh

      - name: Release authority contract test
        # The release gate consumes this decision; it must refuse failed,
        # foreign, stale or partial CI evidence. Hermetic: stub gh, canned JSON.
        run: bash tools/release-authority-test.sh

  codegen-drift:
    name: Codegen Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Bun for generated plugin tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Regenerate
        run: make generate

      - name: Verify committed files match codegen output
        # Catches generated files (lifecycle registration/payload descriptors,
        # schema.xml, skills/**/SKILL.md, agents/*.md,
        # .opencode/**, opencode.json) that were hand-edited or left stale after
        # a change to internal/codegen. git status --porcelain also catches newly
        # generated files that were never committed, which git diff alone would
        # miss.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale — run 'make generate' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Prove second regeneration is byte-identical
        # Hash the full tracked/untracked inventory, including dot trees and
        # compressed embedded assets. A diff alone cannot detect new files.
        shell: bash
        run: |
          set -euo pipefail
          snapshot() {
            git ls-files --cached --others --exclude-standard -z |
              sort -z | xargs -0 sha256sum --zero
          }
          snapshot > "$RUNNER_TEMP/codegen-before"
          make generate
          snapshot > "$RUNNER_TEMP/codegen-after"
          cmp "$RUNNER_TEMP/codegen-before" "$RUNNER_TEMP/codegen-after"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::Second regeneration changed the tracked/untracked inventory — repair canonical sources and commit regenerated outputs."
            git status --porcelain --untracked-files=all
            exit 1
          fi

      - name: Verify all-target output and embedded inventories
        run: CGO_ENABLED=0 go test ./internal/codegen/... ./internal/target/claudecode/... ./internal/target/opencode/... ./internal/target/codex/...
