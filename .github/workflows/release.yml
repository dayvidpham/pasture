name: Release

# Release consumes the successful CI result for one exact main commit instead
# of re-running the test suite here. CI is the single authority: race
# correctness, controlled performance, recovery, lint and codegen drift must
# already be green for that commit.
#
# Flow: a version bump lands on main -> CI runs -> this workflow starts when CI
# completes, verifies the CI run is a trusted push-to-main success for the exact
# commit, then tags that commit, builds the binaries and publishes. A missing,
# failed, cancelled, stale, foreign or partial CI result fails closed. The
# manual dispatch applies the same check to the current main commit, which also
# recovers a pushed version whose tag was never created.
#
# Requires two repo secrets for the tag push (a GitHub App, preferred):
#   RELEASE_APP_ID           — the App's ID
#   RELEASE_APP_PRIVATE_KEY  — the App's private key (PEM)
# The App needs Contents: write on this repo. Using an App token (not the default
# GITHUB_TOKEN) means the tag is created under a real bot identity, fires any other
# tag-watchers, and works if you later add tag-ref protection. A fine-grained PAT
# stored as a secret works too — swap the create-github-app-token step for one that
# sets GH_TOKEN from secrets.RELEASE_TOKEN.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}   # manual recovery of the current main version

permissions:
  contents: read
  actions: read

# One release decision at a time. A second CI completion waits, then finds the
# tag already created and does nothing.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REQUIRED_CI_WORKFLOW: ci.yml
  REQUIRED_CI_JOBS: '["Build & Test (1.26)","Lint","Codegen Drift"]'

jobs:
  verify:
    name: Verify CI authority for the exact commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authority.outputs.sha }}
      version: ${{ steps.authority.outputs.version }}
      released: ${{ steps.authority.outputs.released }}
    steps:
      - name: Verify CI authority
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          REQUIRED_WORKFLOW: ${{ env.REQUIRED_CI_WORKFLOW }}
          REQUIRED_JOBS: ${{ env.REQUIRED_CI_JOBS }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$RUN_SHA"; run_id="$RUN_ID"
          else
            sha="$DISPATCH_SHA"; run_id=""
          fi
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || fail "commit '$sha' is not an exact 40-character lowercase SHA"

          if [ -z "$run_id" ]; then
            # Manual recovery: the newest completed push run of the CI workflow
            # for this exact main commit. Selecting the newest run for the commit
            # means an older success cannot hide a newer failure.
            run_id="$(gh api "repos/$REPO/actions/workflows/$REQUIRED_WORKFLOW/runs?branch=main&event=push&status=completed&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$sha\")] | sort_by(.created_at) | last | .id // empty")"
            [ -n "$run_id" ] || fail "no completed CI run on main for commit $sha"
          fi

          gh api "repos/$REPO/actions/runs/$run_id" > "$RUNNER_TEMP/run.json"
          jq -e --arg repo "$REPO" --arg sha "$sha" --arg path ".github/workflows/$REQUIRED_WORKFLOW" '
            .id != null
            and .head_sha == $sha
            and .event == "push"
            and .head_branch == "main"
            and .status == "completed"
            and .conclusion == "success"
            and .path == $path
            and (.head_repository.full_name // "") == $repo
            and (.repository.full_name // "") == $repo
          ' "$RUNNER_TEMP/run.json" >/dev/null \
            || fail "CI run $run_id is not a successful push-to-main run of $REQUIRED_WORKFLOW for $sha"

          # Every job of that run must be green in its latest attempt, and the
          # named required jobs must actually exist. A run that lost or skipped
          # a required job is not authority.
          gh api "repos/$REPO/actions/runs/$run_id/jobs?filter=latest&per_page=100" > "$RUNNER_TEMP/jobs.json"
          jq -e --argjson required "$REQUIRED_JOBS" '
            (.jobs | length) > 0
            and all(.jobs[]; .status == "completed" and .conclusion == "success")
            and (($required - [.jobs[].name]) | length) == 0
          ' "$RUNNER_TEMP/jobs.json" >/dev/null \
            || fail "CI run $run_id does not have every required job green"

          version="$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/$REPO/contents/.claude-plugin/plugin.json?ref=$sha" | jq -r .version)"
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || fail "plugin version '$version' at $sha is not x.y.z"

          tag_commit="$(gh api "repos/$REPO/commits/v$version" --jq .sha 2>/dev/null || true)"
          if [ -n "$tag_commit" ]; then
            [ "$tag_commit" = "$sha" ] \
              || fail "tag v$version already points at $tag_commit, not $sha; refusing to move it"
            echo "v$version already released at $sha"
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "CI run $run_id is authoritative for $sha (v$version)"

  tag:
    name: Tag the verified commit
    needs: verify
    if: needs.verify.outputs.released == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.verify.outputs.version }}
      sha: ${{ needs.verify.outputs.sha }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 1
          # Keep the default token out of git credentials so the App token is
          # the only credential used for the tag push.
          persist-credentials: false

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create the tag on the verified commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [ "$sha" = "$VERIFIED_SHA" ] \
            || { echo "::error::checked out $sha, not the verified $VERIFIED_SHA"; exit 1; }

          if existing="$(gh api "repos/$REPO/commits/v$VERSION" --jq .sha 2>/dev/null)"; then
            echo "::error::v$VERSION appeared after verification at $existing; refusing to move or duplicate it"
            exit 1
          fi

          git config user.name  "pasture-release[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git" "v$VERSION"
          echo "tagged v$VERSION on $sha"

  build:
    name: Build ${{ matrix.suffix }}
    needs: tag
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build static binaries
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          TAG="v${{ needs.tag.outputs.version }}"
          LDFLAGS="-s -w -X main.version=${TAG}"
          for cmd in pastured pasture pasture-release; do
            go build -ldflags "${LDFLAGS}" -o "${cmd}-${{ matrix.suffix }}" ./cmd/${cmd}
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.suffix }}
          path: '*-${{ matrix.suffix }}'
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: List downloaded files
        run: ls -la

      - name: Generate checksums.txt
        # One line per release asset in sha256sum's "<hex>  <name>" format. The
        # installer's awk and the upgrade command's parser both match by name
        # and tolerate sha256sum's binary-mode "*" marker.
        #
        # `pasture-*` also matches `pasture-release-*`; `sort -u` de-duplicates,
        # so the file covers exactly the published assets and adapts if the
        # build matrix grows. A missing pattern fails the step loudly.
        run: |
          set -euo pipefail
          ls -1 pastured-* pasture-* | sort -u | xargs sha256sum > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          files: |
            checksums.txt
            pastured-*
            pasture-*
            pasture-release-*
          generate_release_notes: true
          fail_on_unmatched_files: true
