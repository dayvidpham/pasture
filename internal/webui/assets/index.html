    <meta name="color-scheme" content="dark" />
    <script>
      (() => {
        let preference;
        try { preference = window.localStorage.getItem('pasture.theme.preference'); } catch {}
        let theme = preference === 'light' || preference === 'dark' ? preference : 'dark';
        if (preference !== 'light' && preference !== 'dark') {
          try { if (typeof window.matchMedia === 'function') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch {}
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
