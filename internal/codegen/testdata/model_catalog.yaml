# Committed allowlist of native model ids per harness. This is the catalog the
# generator's tier table must agree with, so a faked or stale id fails a test
# even when the emitted agent files are regenerated to match it. Refresh a list
# only together with the documented evidence for the change.
claude-code:
  - claude-opus-4-8
  - claude-sonnet-4-6
  - claude-haiku-4-5
codex:
  - gpt-5.6-sol
  - gpt-5.6-terra
opencode:
  - anthropic/claude-opus-4-8
  - anthropic/claude-sonnet-4-6
  - anthropic/claude-haiku-4-5
