# Constructed pure normalization scenarios, not authenticated host captures.
- name: absent
  models: [null, null, null]
  providers: [null, null, null]
  want_model: {status: unavailable, source: none, reason: no-evidence}
  want_provider: {status: unavailable, source: none, reason: no-evidence}
- name: matched-completion
  models: [M, M, null]
  providers: [null, P, null]
  want_model: {status: observed, source: host, field: model.id, value: M}
  want_provider: {status: observed, source: environment, field: PASTURE_EXECUTION_PROVIDER, value: P}
- name: invalid-host-lone-declaration
  permutations: [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]]
  models: [' bad', M, null]
  want_model: {status: invalid, source: host, field: model.id, reason: rejected-input, candidates: [{source: environment, field: PASTURE_EXECUTION_MODEL, value: M}]}
  want_provider: {status: unavailable, source: none, reason: no-evidence}
- name: invalid-host-complete-declaration
  models: [' bad', M, null]
  providers: [null, P, null]
  want_model: {status: invalid, source: host, field: model.id, reason: rejected-input, candidates: [{source: environment, field: PASTURE_EXECUTION_MODEL, value: M}]}
  want_provider: {status: unavailable, source: none, reason: unpaired-provider, candidates: [{source: environment, field: PASTURE_EXECUTION_PROVIDER, value: P}]}
- name: malformed-model-is-not-malformed-provider
  models: [' bad', M, null]
  providers: [P, Q, null]
  want_model: {status: invalid, source: host, field: model.id, reason: rejected-input, candidates: [{source: environment, field: PASTURE_EXECUTION_MODEL, value: M}]}
  want_provider: {status: unavailable, source: none, reason: unpaired-provider, candidates: [{source: host, field: model.providerID, value: P}, {source: environment, field: PASTURE_EXECUTION_PROVIDER, value: Q}]}
- name: different-complete-pairs-no-anchor
  models: [M, N, null]
  providers: [P, Q, null]
  want_model: {status: conflict, source: none, reason: valid-disagreement, candidates: [{source: host, field: model.id, value: M}, {source: environment, field: PASTURE_EXECUTION_MODEL, value: N}]}
  want_provider: {status: unavailable, source: none, reason: unpaired-provider, candidates: [{source: host, field: model.providerID, value: P}, {source: environment, field: PASTURE_EXECUTION_PROVIDER, value: Q}]}
- name: rejected-host-two-disagreeing-pairs
  permutations: [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]]
  models: [' bad', M, N]
  providers: [null, P, Q]
  want_model: {status: conflict, source: none, reason: valid-disagreement-with-rejected-input, candidates: [{source: environment, field: PASTURE_EXECUTION_MODEL, value: M}, {source: actor-registry, field: model, value: N}]}
  want_provider: {status: unavailable, source: none, reason: unpaired-provider, candidates: [{source: environment, field: PASTURE_EXECUTION_PROVIDER, value: P}, {source: actor-registry, field: provider, value: Q}]}
